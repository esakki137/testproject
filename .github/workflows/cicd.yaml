name: CI-CD to Minikube

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2️⃣ Docker login (Windows PowerShell – validated)
      - name: Docker login
        shell: powershell
        run: |
          $username = "${{ secrets.DOCKER_USERNAME }}"
          $password = "${{ secrets.DOCKER_PASSWORD }}"

          if ([string]::IsNullOrEmpty($username)) {
            throw "DOCKER_USERNAME secret is empty"
          }
          if ([string]::IsNullOrEmpty($password)) {
            throw "DOCKER_PASSWORD secret is empty"
          }

          Write-Host "Logging in to Docker Hub as $username"
          $password | docker login -u $username --password-stdin

      # 3️⃣ Build Docker image
      - name: Build Docker image
        shell: powershell
        run: |
          docker build -t esakkimuthus/springapp1:${{ github.sha }} .

      # 4️⃣ Push Docker image
      - name: Push Docker image
        shell: powershell
        run: |
          docker push esakkimuthus/springapp1:${{ github.sha }}

      # 5️⃣ Verify kubectl + Minikube access
      - name: Verify kubectl and cluster
        shell: powershell
        run: |
          kubectl version --client
          kubectl config current-context
          kubectl cluster-info

      # 6️⃣ Deploy to Minikube
      - name: Deploy to Minikube
        shell: powershell
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/spring-app `
            spring-app=esakkimuthus/springapp1:${{ github.sha }}
          kubectl rollout status deployment/spring-app
