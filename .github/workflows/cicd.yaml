name: CI-CD to Minikube

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Docker login (Windows safe)
        shell: cmd
        run: |
          docker logout
          echo %DOCKER_PASSWORD% | docker login -u %DOCKER_USERNAME% --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t esakkimuthus/springapp1:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push esakkimuthus/springapp1:${{ github.sha }}

      - name: Verify kubectl
        run: |
          kubectl version --client
          kubectl cluster-info

      - name: Deploy to Minikube
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/spring-app spring-app=esakkimuthus/springapp1:${{ github.sha }}
          kubectl rollout status deployment/spring-app
