name: CI-CD to Minikube

on:
  push:
    branches:
      - master   # or master if your repo uses master

jobs:
  deploy:
    runs-on: self-hosted   # use self-hosted in real setup

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: |
        docker build -t esakkimuthus/springapp1:${{ github.sha }} .

    - name: Push Docker image
      run: |
        docker push esakkimuthus/springapp1:${{ github.sha }}

    - name: Configure kubeconfig
      run: |
        echo "${{ secrets.KUBECONFIG }}" | base64 --decode > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig

    - name: Deploy to Minikube
      run: |
        kubectl apply -f k8s/
        kubectl set image deployment/spring-app \
        spring-app=esakkimuthus/springapp1:${{ github.sha }}
        kubectl rollout status deployment spring-app
